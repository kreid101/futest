services:
  app:
    build:
      context: .
      target: app
    env_file: .env
    entrypoint: ["/bin/sh", "/var/www/html/docker/php/entrypoint.sh"]
    command: ["php-fpm"]
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/app.ini:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    build:
      context: .
      target: nginx
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  test-db:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: tasks_test
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d tasks_test']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  app_vendor:
  app_storage:
  app_bootstrap_cache:
  postgres_data:
